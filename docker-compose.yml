services:
  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.5-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/kobutsu-ledger-api:/var/www/html/wp-content/plugins/kobutsu-ledger-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - wordpress
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_WORDPRESS_URL: http://localhost:8081
      WORDPRESS_INTERNAL_URL: http://wordpress
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  wordpress_data:
  frontend_node_modules:
